<template id="scene-platforms-template">
  <div
    id="scene-platforms"
    data-composition-id="scene-platforms"
    data-width="1920"
    data-height="1080"
    class="scene scene-light"
  >
    <style>
      #scene-platforms {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        background: #faf8f6;
        color: #1a1a1a;
        opacity: 0;
      }
      #scene-platforms .platforms-title {
        position: relative;
        font-size: 60px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #scene-platforms .platforms-sub {
        position: relative;
        margin-top: 16px;
        font-size: 26px;
        color: #4d4d4d;
      }
      #scene-platforms .platform-row {
        position: relative;
        margin-top: 64px;
        display: flex;
        gap: 26px;
        align-items: center;
        justify-content: center;
      }
      #scene-platforms .platform-badge {
        width: 118px;
        height: 118px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 14px 34px rgba(12, 22, 39, 0.14);
      }
    </style>

    <h2 class="platforms-title">Mendukung 10+ platform</h2>
    <p class="platforms-sub">Satu tempat kerja, semua kanal terhubung</p>

    <div class="platform-row">
      <div class="platform-badge" style="background: #e4405f">IG</div>
      <div class="platform-badge" style="background: #1877f2">FB</div>
      <div class="platform-badge" style="background: #1a1a1a">TT</div>
      <div class="platform-badge" style="background: #ff0000">YT</div>
      <div class="platform-badge" style="background: #e60023">PN</div>
      <div class="platform-badge" style="background: #0a66c2">LI</div>
      <div class="platform-badge" style="background: #0285ff">BS</div>
      <div class="platform-badge" style="background: #4285f4">GB</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        const scope = "#scene-platforms";

        tl.fromTo(scope, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
        tl.fromTo(
          scope + " .platforms-title",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.6 },
          0.4,
        );
        tl.fromTo(scope + " .platforms-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 0.8);
        tl.fromTo(
          scope + " .platform-badge",
          { opacity: 0, scale: 0.3, y: 26 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, stagger: 0.08 },
          1.3,
        );
        tl.to(scope, { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);

        window.__timelines["scene-platforms"] = tl;
      })();
    </script>
  </div>
</template>
