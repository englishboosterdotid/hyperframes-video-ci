<template id="scene-problem-template">
  <div
    id="scene-problem"
    data-composition-id="scene-problem"
    data-width="1920"
    data-height="1080"
    class="scene scene-light"
  >
    <style>
      #scene-problem {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        background: #faf8f6;
        color: #1a1a1a;
        opacity: 0;
      }
      #scene-problem .problem-title {
        position: relative;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.03em;
        z-index: 2;
      }
      #scene-problem .problem-sub {
        position: relative;
        margin-top: 20px;
        font-size: 27px;
        color: #4d4d4d;
        z-index: 2;
      }
      #scene-problem .chaos-field {
        position: relative;
        margin-top: 64px;
        width: 1200px;
        height: 380px;
      }
      #scene-problem .chaos-badge {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 18px 40px rgba(12, 22, 39, 0.16);
      }
      #scene-problem .solution-title {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      #scene-problem .solution-title .big {
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: #0c1627;
      }
      #scene-problem .solution-title .big .hl-dark {
        color: #08a5fc;
      }
      #scene-problem .solution-title .small {
        margin-top: 22px;
        font-size: 28px;
        color: #4d4d4d;
      }
    </style>

    <h2 class="problem-title">Berpindah aplikasi setiap hari?</h2>
    <p class="problem-sub">Setiap platform punya app-nya sendiri.</p>

    <div class="chaos-field">
      <div class="chaos-badge" data-layout-allow-overlap style="left: 40px; top: 30px; background: #e4405f">IG</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 260px; top: 150px; background: #1877f2">FB</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 470px; top: 20px; background: #1a1a1a">TT</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 660px; top: 180px; background: #ff0000">YT</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 850px; top: 40px; background: #e60023">PN</div>
      <div class="chaos-badge" data-layout-allow-overlap style="right: 40px; top: 170px; background: #0a66c2">LI</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 150px; bottom: 0px; background: #0285ff">BS</div>
      <div class="chaos-badge" data-layout-allow-overlap style="left: 560px; bottom: 20px; background: #4285f4">GB</div>

      <div class="solution-title">
        <div class="big">Cukup <span class="hl-dark">satu dashboard.</span></div>
        <div class="small">Untuk semua platform social media Anda.</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        const scope = "#scene-problem";

        tl.fromTo(scope, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
        tl.fromTo(scope + " .problem-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6 }, 0.4);
        tl.fromTo(scope + " .problem-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 0.8);
        tl.fromTo(
          scope + " .chaos-badge",
          { opacity: 0, scale: 0.3 },
          { opacity: 1, scale: 1, duration: 0.5, stagger: 0.1 },
          1.1,
        );
        tl.to(scope + " .problem-title", { opacity: 0, y: -20, duration: 0.4 }, 2.8);
        tl.to(scope + " .problem-sub", { opacity: 0, y: -12, duration: 0.4 }, 2.9);
        tl.to(scope + " .chaos-badge", { opacity: 0.22, scale: 0.92, duration: 0.6 }, 3.0);
        tl.fromTo(
          scope + " .solution-title .big",
          { opacity: 0, y: 44, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8 },
          3.4,
        );
        tl.fromTo(
          scope + " .solution-title .small",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.6 },
          4.1,
        );
        tl.to(scope, { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.5);

        window.__timelines["scene-problem"] = tl;
      })();
    </script>
  </div>
</template>
